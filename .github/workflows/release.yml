name: build-release

on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # 创建 Release 所需

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Nim 2.2.10
        run: |
          curl -fsSL -o /tmp/nim.tar.xz https://nim-lang.org/download/nim-2.2.10-linux_x64.tar.xz
          tar -xf /tmp/nim.tar.xz -C /opt
          echo "/opt/nim-2.2.10/bin" >> "$GITHUB_PATH"

      - name: 构建 (release)
        run: nim c -d:release -o:bin/scheduler src/scheduler/main.nim

      - name: 重命名为平台产物名
        run: cp bin/scheduler bin/scheduler-linux-x64

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: scheduler-linux-x64
          path: bin/scheduler-linux-x64
          if-no-files-found: error

      - name: 创建 Release（仅 tag）
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: bin/scheduler-linux-x64
          generate_release_notes: true
          fail_on_unmatched_files: true
